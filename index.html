<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>You Caught a Bug!</title>
  <style>
    body {
      margin: 0; padding: 0;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      background: #fffbe6;
      color: #333;
      position: relative;
      overflow: hidden;
      /* Parallax background */
      background: url('bg.jpg') center/cover fixed;
    }
    #particles-js { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; }
    .bug {
      font-size: 6rem; cursor: pointer;
      animation: bounce 2s ease-in-out infinite;
      display: inline-block;
    }
    h1 {
      margin: 0.5em 0;
      display: inline-block;
      animation: glitch 1s infinite;
    }
    .message {
      max-width: 600px; margin: 20px auto; font-size: 1.2rem;
    }
    a { color: #0077cc; text-decoration: none; }
    /* Animations */
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-20px); }
    }
    @keyframes glitch {
      0%   { text-shadow: 2px 0 red; }
      20%  { text-shadow: -2px 0 blue; }
      40%  { text-shadow: 2px 2px lime; }
      60%  { text-shadow: -2px -2px magenta; }
      80%  { text-shadow: 2px -2px cyan; }
      100% { text-shadow: -2px 2px yellow; }
    }
  </style>
</head>
<body>
  <div id="particles-js"></div>
  <div class="bug">🐞</div>
  <h1>You Caught a Bug!</h1>
  <div class="message">
    Nice catch! Spotting this means you’ve got a tester’s eye—just what every team needs.
    <br><br><em>Imagine what I’ll find in your app 😉</em>
    <br><br>
    <a href="https://github.com/salonijain12345" target="_blank">Back to My Projects</a>
  </div>
  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <!-- Audio -->
  <audio id="sound" src="pop-sound.mp3" preload="auto"></audio>
  <script>
    // Particles init
    particlesJS.load('particles-js','/particles-config.json');
    // Confetti & sound
    const sound = document.getElementById('sound');
    window.onload = () => {
      confetti({ particleCount: 100 });
      sound.play();
    };
    document.body.addEventListener('click', e => {
      confetti({ spread: 70 });
      // Emoji burst
      const emojis = ['🐛','🦋','🕷','🐝'];
      const span = document.createElement('span');
      span.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      span.style.position = 'absolute';
      span.style.left = `${e.pageX}px`; span.style.top = `${e.pageY}px`;
      document.body.appendChild(span);
      setTimeout(()=>span.remove(),1000);
      sound.play();
    });
  </script>
</body>
</html>
