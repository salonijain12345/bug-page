<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>You Caught a Bug!</title>
  <style>
    /* 1. Full-screen & parallax body background */
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      color: #333;
      text-align: center;
      background: #ffe6f0 url('bg.jpg') center/cover fixed;
      position: relative;
    }

    /* 2. Particles at the very back */
    #particles-js {
      position: fixed;
      inset: 0;
      z-index: -2;
    }

    /* 3. Wandering ants, behind the content but above the page background */
    .ant {
      position: absolute;
      width: 24px; height: 24px;
      background: url('https://icons.iconarchive.com/icons/lyle-zapato/arthropodicons/32/Black-Ant-icon.png')
                  no-repeat center/contain;
      opacity: 0;
      will-change: transform, opacity;
      z-index: -1;
    }
    @keyframes wander {
      to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); }
    }

    /* 4. Foreground content */
    .bug {
      font-size: 6rem;
      cursor: pointer;
      animation: bounce 2s ease-in-out infinite;
      position: relative;
      z-index: 0;
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-20px); }
    }

    h1 {
      margin: 0.5em 0;
      display: inline-block;
      animation: glitch 1s infinite;
      position: relative;
      z-index: 0;
    }
    @keyframes glitch {
      0%   { text-shadow: 2px 0 red; }
      20%  { text-shadow: -2px 0 blue; }
      40%  { text-shadow: 2px 2px lime; }
      60%  { text-shadow: -2px -2px magenta; }
      80%  { text-shadow: 2px -2px cyan; }
      100% { text-shadow: -2px 2px yellow; }
    }

    .message {
      max-width: 600px;
      margin: 20px auto;
      font-size: 1.2rem;
      position: relative;
      z-index: 0;
    }
    a {
      color: #0077cc;
      text-decoration: none;
      position: relative;
      z-index: 0;
    }
  </style>
</head>
<body>

  <!-- Particles.js layer -->
  <div id="particles-js"></div>

  <!-- Your bug icon & text -->
  <div class="bug">🐞</div>
  <h1>You Caught a Bug!</h1>
  <div class="message">
    Nice catch! Spotting this means you’ve got a tester’s eye—just what every team needs.
    <br><br><em>Imagine what I’ll find in your app 😉</em>
    <br><br>
    <a href="https://github.com/salonijain12345" target="_blank">Back to My Projects</a>
  </div>

  <!-- Wandering-ants Script -->
  <script>
    const ANT_COUNT = 12,
          MAX_STEP    = 200,
          MIN_DUR     = 4,
          MAX_DUR     = 12;

    // Spawn ants
    for (let i = 0; i < ANT_COUNT; i++) {
      const ant = document.createElement('div');
      ant.className = 'ant';
      document.body.appendChild(ant);

      // Random start
      const x = Math.random() * innerWidth;
      const y = Math.random() * innerHeight;
      ant.style.left = x + 'px';
      ant.style.top  = y + 'px';

      // Random vector & rotation
      const dx = (Math.random()-0.5)*MAX_STEP;
      const dy = (Math.random()-0.5)*MAX_STEP;
      ant.style.setProperty('--dx', `${dx}px`);
      ant.style.setProperty('--dy', `${dy}px`);
      ant.style.setProperty('--rot', `${Math.atan2(dy,dx)*180/Math.PI}deg`);

      // Random duration
      const dur = MIN_DUR + Math.random()*(MAX_DUR - MIN_DUR);
      ant.style.animation = `wander ${dur}s ease-in-out infinite alternate`;

      // Fade in
      requestAnimationFrame(() => ant.style.opacity = .7);
    }

    // Re-spawn on resize
    window.addEventListener('resize', () => {
      document.querySelectorAll('.ant').forEach(ant => {
        ant.style.left = Math.random()*innerWidth + 'px';
        ant.style.top  = Math.random()*innerHeight + 'px';
      });
    });
  </script>

  <!-- Particles.js & Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <audio id="sound" src="https://www.soundjay.com/misc/sounds/magic-chime-01.mp3" preload="auto"></audio>
  <script>
   particlesJS.load(
  'particles-js',
  'https://gist.githubusercontent.com/miguelmota/c2d2137eaa27e0359b28dfb39705d8d9/raw/2cd91de201fab8d13c6a7be7d65f35bd5f8b9804/particles.js',
  function() {
    console.log('particles.js config loaded');
  }
);
    const sound = document.getElementById('sound');
    window.onload = () => { confetti({ particleCount:100 }); sound.play(); };
    document.body.addEventListener('click', e => {
      confetti({ spread: 70 });
      const emojis = ['🐛','🦋','🕷','🐝'];
      const s = document.createElement('span');
      s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      Object.assign(s.style, {
        position: 'absolute',
        left:  e.pageX + 'px',
        top:   e.pageY + 'px',
        zIndex: 0
      });
      document.body.appendChild(s);
      setTimeout(()=>s.remove(),1000);
      sound.play();
    });
  </script>
</body>
</html>
